name: Ejemplo SonarCloud
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-y-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonando mi repositorio
        uses: actions/checkout@v4
      - name: Configurando JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cacheando paquetes Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{hashFiles('**/pom.xml')}}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build & Test
        run: ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Ejecutando análisis estático de código
        run: | 
          mvn sonar:sonar \
            -Dsonar.projectKey=WinTux_20260519 \
            -Dsonar.organization=wintux-1 \
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io